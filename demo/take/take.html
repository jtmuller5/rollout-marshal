<!doctype html>
<!--
  The on-camera surface for shot 4 of the demo.

  It renders one thing only: events the driver pushed after they happened. There is no
  animation on a timer, no scripted text, and nothing here reads the clock to decide what
  to show. If the driver pushes nothing, this page sits still, which is the property that
  makes it usable as evidence.

  Written by an autonomous agent working for Joe Muller.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rollout Marshal — live take</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11161f;
    --line: #1e2733;
    --dim: #6b7a8d;
    --fg: #ccd6e4;
    --hot: #ff5f56;
    --ok: #3fd68a;
    --warn: #f7c948;
    --model: #7aa2f7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "DejaVu Sans Mono", "Liberation Mono", monospace;
    overflow: hidden;
  }
  #grid {
    display: grid; height: 100%;
    grid-template-rows: 56px 1fr 76px;
    grid-template-columns: 34% 1fr;
    grid-template-areas: "bar bar" "left right" "cmd cmd";
    gap: 1px; background: var(--line);
  }
  header { grid-area: bar; background: var(--panel); display: flex; align-items: center;
           gap: 20px; padding: 0 22px; font-size: 20px; }
  header .brand { font-weight: bold; letter-spacing: 1px; }
  header .target { color: var(--dim); }
  header .spacer { flex: 1; }
  header .rec { color: var(--hot); }
  header .clock { font-size: 24px; }
  #left { grid-area: left; background: var(--panel); padding: 18px 20px; overflow: hidden; }
  #right { grid-area: right; background: var(--panel); padding: 14px 18px; overflow: hidden;
           display: flex; flex-direction: column; }
  #cmd { grid-area: cmd; background: #070a0f; padding: 14px 22px; font-size: 22px;
         overflow: hidden; }
  h2 { font-size: 15px; letter-spacing: 2px; color: var(--dim); font-weight: normal;
       margin: 0 0 10px; text-transform: uppercase; }
  .card { border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 20px; }
  .kv { display: flex; justify-content: space-between; font-size: 18px; padding: 3px 0; }
  .kv span:first-child { color: var(--dim); }
  .pill { font-size: 40px; text-align: center; padding: 16px 0; border: 2px solid var(--line); }
  .pill.inProgress { color: var(--warn); border-color: var(--warn); }
  .pill.halted { color: var(--hot); border-color: var(--hot); }
  .pill.completed { color: var(--ok); border-color: var(--ok); }
  .reads { font-size: 15px; color: var(--dim); margin-top: 10px; line-height: 1.6; }
  #stream { flex: 1; overflow: hidden; font-size: 19px; line-height: 1.5;
            display: flex; flex-direction: column; justify-content: flex-end; }
  .ev { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
  .ev .ts { color: var(--dim); }
  .ev .k { display: inline-block; min-width: 122px; }
  .k-tick .k, .k-tick { color: #fff; }
  .k-read .k { color: var(--dim); }
  .k-think .k, .k-think { color: var(--model); }
  .k-propose .k, .k-propose { color: var(--warn); }
  .k-gate\.refuse .k, .k-gate\.refuse { color: var(--hot); }
  .k-gate\.allow .k, .k-gate\.allow { color: var(--ok); }
  .k-act .k, .k-act { color: var(--ok); }
  .k-api .k, .k-api { color: var(--ok); }
  .k-mail .k { color: var(--dim); }
  .k-error .k, .k-error { color: var(--hot); }
  .prompt { color: var(--ok); }
  .caret { background: var(--fg); color: var(--bg); }
  .note { font-size: 15px; color: var(--dim); margin-top: 6px; }
  .beat { color: var(--warn); font-size: 15px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="grid">
  <header>
    <span class="brand">ROLLOUT MARSHAL</span>
    <span class="target" id="target">—</span>
    <span class="spacer"></span>
    <span class="beat" id="beat"></span>
    <span class="rec">● REC <span id="elapsed">00:00</span></span>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <div id="left">
    <h2>Policy, declared before the release</h2>
    <div class="card" id="policy"><div class="kv"><span>waiting</span><span>—</span></div></div>
    <h2>Play track, read from the API</h2>
    <div class="card">
      <div class="pill" id="pill">—</div>
      <div class="kv"><span>release</span><span id="rel">—</span></div>
      <div class="kv"><span>client</span><span id="src">—</span></div>
      <div class="reads" id="reads"></div>
    </div>
    <div id="mailwrap" style="display:none">
      <h2>The email, sent after the fact</h2>
      <div class="card"><div id="mail" style="font-size:15px;line-height:1.55;white-space:pre-wrap"></div></div>
    </div>
  </div>

  <div id="right">
    <h2>The agent, live on /stream</h2>
    <div id="stream"></div>
  </div>

  <div id="cmd"><span class="prompt">$</span> <span id="cmdtext"></span><span class="caret">&nbsp;</span></div>
</div>

<script>
// The clock is the browser's own and never stops. A cut in the recording shows up here.
function two(n) { return String(n).padStart(2, "0"); }
let started = null;
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent =
    two(d.getUTCHours()) + ":" + two(d.getUTCMinutes()) + ":" + two(d.getUTCSeconds()) + "Z";
  if (started !== null) {
    const s = Math.floor((Date.now() - started) / 1000);
    document.getElementById("elapsed").textContent = two(Math.floor(s / 60)) + ":" + two(s % 60);
  }
}, 100);

const stream = document.getElementById("stream");

function hhmmss(iso) { return (iso || "").slice(11, 19); }

function onEvent(e) {
  if (e.kind === "start") {
    started = Date.now();
    document.getElementById("target").textContent = e.text;
  } else if (e.kind === "beat") {
    document.getElementById("beat").textContent = e.text;
  } else if (e.kind === "policy") {
    const p = e.data, box = document.getElementById("policy");
    box.innerHTML = "";
    for (const [k, v] of p.rows) {
      const row = document.createElement("div");
      row.className = "kv";
      row.innerHTML = "<span></span><span></span>";
      row.children[0].textContent = k;
      row.children[1].textContent = v;
      box.appendChild(row);
    }
  } else if (e.kind === "track") {
    const t = e.data;
    const pill = document.getElementById("pill");
    pill.textContent = t.status + (t.user_fraction === null ? "" : "  " + Math.round(t.user_fraction * 100) + "%");
    pill.className = "pill " + t.status;
    document.getElementById("rel").textContent = t.release + " (" + t.version_code + ")";
    document.getElementById("src").textContent = t.source;
    const reads = document.getElementById("reads");
    const line = document.createElement("div");
    line.textContent = "read " + hhmmss(e.ts) + "  " + t.status +
      (t.user_fraction === null ? "" : " " + Math.round(t.user_fraction * 100) + "%");
    reads.prepend(line);
    while (reads.children.length > 6) reads.lastChild.remove();
  } else if (e.kind === "email") {
    document.getElementById("mailwrap").style.display = "block";
    document.getElementById("mail").textContent = e.text;
  } else if (e.kind === "cmd") {
    type(e.text);
  } else if (e.kind === "note") {
    push("note", e.ts, e.text);
  } else {
    push(e.kind, e.ts, e.text);
  }
}

function push(kind, ts, text) {
  const div = document.createElement("div");
  div.className = "ev k-" + kind;
  const t = document.createElement("span");
  t.className = "ts";
  t.textContent = hhmmss(ts) + " ";
  const k = document.createElement("span");
  k.className = "k";
  k.textContent = kind.toUpperCase() + " ";
  const body = document.createElement("span");
  body.textContent = text;
  div.append(t, k, body);
  stream.appendChild(div);
  while (stream.children.length > 26) stream.firstChild.remove();
}

// Typed one character at a time, so the command is readable on camera rather than
// appearing whole. It is display only; the driver has already run it.
let typing = null;
function type(text) {
  if (typing) clearInterval(typing);
  const el = document.getElementById("cmdtext");
  el.textContent = "";
  let i = 0;
  typing = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(typing); typing = null; }
  }, 18);
}

let since = 0;
async function poll() {
  try {
    const r = await fetch("/events?since=" + since);
    const j = await r.json();
    for (const e of j.events) onEvent(e);
    since = j.next;
  } catch (err) { /* the server is not up yet; the next poll retries */ }
  setTimeout(poll, 150);
}
poll();
</script>
</body>
</html>
